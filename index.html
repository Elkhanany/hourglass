<!doctype html>
<html lang="en" data-theme="sahara">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Hourglass</title>
  <!-- this page's release: sw.js's VERSION names the same (check-release); Tune's last line shows it -->
  <meta name="hourglass-version" content="1.12.0">
  <meta name="description" content="A hyper-realistic sand hourglass timer. Every grain is simulated; every sound is synthesised live.">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hourglass">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <!-- iPhone launch screens: dark, so a home-screen launch never flashes white -->
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./icons/splash/splash-1320x2868.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./icons/splash/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./icons/splash/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./icons/splash/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./icons/splash/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./icons/splash/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./icons/splash/splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./icons/splash/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./icons/splash/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./icons/splash/splash-750x1334.png">
  <style>html,body{background:#0b0c0e}</style>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app" data-state="idle">

  <!-- warm light pooling behind the glass -->
  <div id="ambient" aria-hidden="true"><div id="breath" hidden></div></div>

  <!-- the instrument -->
  <main id="stage" aria-label="Hourglass. Tap to start or pause. Drag to move or turn it. Spread two fingers for Zen, pinch them to come back.">
    <div id="zoom">
    <div id="shadow" aria-hidden="true"></div>
    <div id="assembly">
      <div id="rotor">
        <canvas id="c-back" aria-hidden="true"></canvas>
        <canvas id="c-glass-back" aria-hidden="true"></canvas>
        <canvas id="c-sand" aria-hidden="true"></canvas>
        <canvas id="c-bloom" aria-hidden="true"></canvas>
        <canvas id="c-glass-front" aria-hidden="true"></canvas>
        <canvas id="c-front" aria-hidden="true"></canvas>
      </div>
      <canvas id="c-light" aria-hidden="true"></canvas>
    </div>
    <!-- sand that got out of the glass, on the desk below it -->
    <canvas id="c-spill" aria-hidden="true"></canvas>
    </div>
  </main>

  <!-- top HUD: readout -->
  <header id="hud-top" class="hud">
    <div class="top-row">
      <button id="btn-theme" class="chip" type="button" aria-label="Change material">
        <span class="swatch" aria-hidden="true"></span><span id="theme-name">Sahara Quartz</span>
      </button>
      <div class="top-actions">
      <button id="btn-motion" class="icon-btn" type="button" aria-label="Allow real motion this time" hidden>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.2" y="4.6" width="7.6" height="14.8" rx="1.8" transform="rotate(20 12 12)"/><path d="M4.4 9.2a8.6 8.6 0 0 1 2-3.4M19.6 14.8a8.6 8.6 0 0 1-2 3.4"/></svg>
      </button>
      <button id="btn-zen" class="icon-btn" type="button" aria-label="Zen: let the glass fill the screen">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.2 14.6A7.8 7.8 0 0 1 9.4 4.8a7.8 7.8 0 1 0 9.8 9.8z"/></svg>
      </button>
      <button id="btn-mute" class="icon-btn" type="button" aria-label="Mute sound" aria-pressed="false">
        <svg class="ic ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4z"/><path class="wave" d="M15.2 9.2a4 4 0 0 1 0 5.6M17.6 6.8a7.4 7.4 0 0 1 0 10.4"/></svg>
        <svg class="ic ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4z"/><path class="wave" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>
      </button>
      </div>
    </div>
    <div id="readout" role="timer" aria-live="off" aria-label="Time remaining. Tap to set a custom duration.">
      <span id="t-main">05:00</span><span id="t-frac">.0</span>
    </div>
    <div id="status" aria-live="polite">Tap the glass to begin</div>
  </header>

  <!-- bottom HUD: floating control bar -->
  <footer id="hud-bottom" class="hud">
    <div class="panel">
      <div id="duration-row">
        <div id="durations" role="radiogroup" aria-label="Duration">
<button class="pill" type="button" role="radio" aria-checked="false" data-min="1" aria-label="1 minute">1<i>m</i></button>
          <button class="pill" type="button" role="radio" aria-checked="true" data-min="5" aria-label="5 minutes">5<i>m</i></button>
          <button class="pill" type="button" role="radio" aria-checked="false" data-min="10" aria-label="10 minutes">10<i>m</i></button>
          <button class="pill" type="button" role="radio" aria-checked="false" data-min="15" aria-label="15 minutes">15<i>m</i></button>
          <button class="pill" type="button" role="radio" aria-checked="false" data-min="30" aria-label="30 minutes">30<i>m</i></button>
          <button class="pill" type="button" role="radio" aria-checked="false" data-min="60" aria-label="60 minutes">60<i>m</i></button>
        </div>
        <button class="pill pill-custom" id="pill-custom" type="button" aria-pressed="false" aria-haspopup="dialog" aria-label="Custom duration">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.2"/><path d="M12 9v4.2l2.6 1.6M9.5 3.2h5"/></svg>
          <span id="custom-label">Custom</span>
        </button>
      </div>

      <div id="actions">
        <button id="btn-reset" class="act" type="button" aria-label="Reset">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 12a6.8 6.8 0 1 0 2.1-4.9"/><path d="M4.6 4.6v3.9h3.9"/></svg>
          <span>Reset</span>
        </button>
        <button id="btn-sand" class="act" type="button" aria-label="Add sand. Hold to pour.">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2v8.6M7.7 8.5h8.6"/><path class="dots" d="M6.2 17.4h.01M9.1 19.3h.01M12 17.6h.01M14.9 19.3h.01M17.8 17.4h.01"/></svg>
          <span>Sand</span>
        </button>
        <button id="btn-play" class="act primary" type="button" aria-label="Start">
          <svg class="ic ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 5.4v13.2L19 12 8.2 5.4z"/></svg>
          <svg class="ic ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.4 5.5v13M15.6 5.5v13"/></svg>
        </button>
        <button id="btn-flip" class="act" type="button" aria-label="Flip the hourglass">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/></svg>
          <span>Flip</span>
        </button>
        <button id="btn-settings" class="act" type="button" aria-label="Sound, material and motion settings" aria-haspopup="dialog">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7.5h8.4M17.4 7.5H19M5 16.5h1.6M10.6 16.5H19"/><circle cx="15.4" cy="7.5" r="2"/><circle cx="8.6" cy="16.5" r="2"/></svg>
          <span>Tune</span>
        </button>
      </div>
    </div>
  </footer>

  <div id="scrim" hidden></div>

  <!-- settings sheet -->
  <section id="sheet-settings" class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="settings-title">Tune</h2>
      <button class="icon-btn sheet-close" type="button" aria-label="Close">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>

    <div class="sheet-body">
      <h3>Material</h3>
      <div id="themes" class="cards" role="radiogroup" aria-label="Material">
        <button class="card" type="button" role="radio" aria-checked="true" data-theme-id="sahara">
          <span class="orb orb-sahara" aria-hidden="true"></span>
          <b>Sahara Quartz</b><small>Walnut</small>
        </button>
        <button class="card" type="button" role="radio" aria-checked="false" data-theme-id="volcanic">
          <span class="orb orb-volcanic" aria-hidden="true"></span>
          <b>Volcanic Black</b><small>Brushed brass</small>
        </button>
        <button class="card" type="button" role="radio" aria-checked="false" data-theme-id="moonstone">
          <span class="orb orb-moonstone" aria-hidden="true"></span>
          <b>Moonstone</b><small>Frosted silver</small>
        </button>
        <button class="card" type="button" role="radio" aria-checked="false" data-theme-id="lapis">
          <span class="orb orb-lapis" aria-hidden="true"></span>
          <b>Lapis Lazuli</b><small>Gold</small>
        </button>
        <button class="card" type="button" role="radio" aria-checked="false" data-theme-id="rosequartz">
          <span class="orb orb-rosequartz" aria-hidden="true"></span>
          <b>Rose Quartz</b><small>Copper</small>
        </button>
        <button class="card" type="button" role="radio" aria-checked="false" data-theme-id="seaglass">
          <span class="orb orb-seaglass" aria-hidden="true"></span>
          <b>Sea Glass</b><small>Driftwood</small>
        </button>
      </div>

      <div class="rows rows-single">
        <label class="row" for="opt-frame">
          <span><b>Frame</b><small>Caps and posts around the glass</small></span>
          <input id="opt-frame" class="switch" type="checkbox" role="switch" checked>
        </label>
        <label class="row" for="opt-layers">
          <span><b>Layered sand</b><small>Two tones that settle into strata as they fall</small></span>
          <input id="opt-layers" class="switch" type="checkbox" role="switch">
        </label>
        <div class="row" id="grain-row">
          <span><b>Grain</b><small id="grain-note">Finer sand is more grains, and more work for the phone</small></span>
        </div>
        <div class="sub">
          <div id="grains" class="segmented" role="radiogroup" aria-label="Sand grain">
            <button type="button" role="radio" aria-checked="true" data-grain="0" aria-label="Classic: the sand as it has been">Classic</button>
            <button type="button" role="radio" aria-checked="false" data-grain="1" aria-label="Fine: twice the grains">Fine <i>×2</i></button>
            <button type="button" role="radio" aria-checked="false" data-grain="2" aria-label="Finest: four times the grains">Finest <i>×4</i></button>
          </div>
        </div>
        <label class="row" for="opt-realsand" id="realsand-row">
          <span><b>Real sand</b><small id="realsand-note">On: every grain simulated on the graphics chip</small></span>
          <input id="opt-realsand" class="switch" type="checkbox" role="switch">
        </label>
      </div>

      <h3>Acoustic character</h3>
      <div id="characters" class="segmented chars" role="radiogroup" aria-label="Acoustic character">
        <button type="button" role="radio" aria-checked="true" data-character="asmr"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/><path d="M18.9 9.4a3.6 3.6 0 0 1 0 5.2M20.6 8.3a5.6 5.6 0 0 1 0 7.4"/></svg><span>Close-Miked ASMR</span></button>
        <button type="button" role="radio" aria-checked="false" data-character="warm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/><path d="M18.7 8.4l1.6-.85M19.6 12h1.8M18.7 15.6l1.6.85M5.3 8.4l-1.6-.85M4.4 12H2.6M5.3 15.6l-1.6.85"/></svg><span>Warm Glass</span></button>
        <button type="button" role="radio" aria-checked="false" data-character="pure"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/><path stroke-width="1.45" d="M19.2 9.7h.01M20 12h.01M19.2 14.3h.01M4.8 9.7h.01M4 12h.01M4.8 14.3h.01"/></svg><span>Pure Sand Whisper</span></button>
        <button type="button" role="radio" aria-checked="false" data-character="chime"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/><path d="M18.9 9.4a3.6 3.6 0 0 1 0 5.2M5.1 9.4a3.6 3.6 0 0 0 0 5.2"/></svg><span>Singing Glass</span></button>
        <button type="button" role="radio" aria-checked="false" data-character="bamboo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/><path d="M3.8 4.6v14.8M20.2 4.6v14.8M3 9.5h1.6M3 14.5h1.6M19.4 9.5h1.6M19.4 14.5h1.6"/></svg><span>Bamboo Rainstick</span></button>
        <button type="button" role="radio" aria-checked="false" data-character="dune"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/><circle cx="20.3" cy="6.7" r="1.6"/><path d="M1.6 19.4C2.7 18.1 3.9 17.5 5.4 17.8M18.6 17.8C20.1 17.5 21.3 18.1 22.4 19.4"/></svg><span>Desert Dune</span></button>
      </div>

      <label class="slider-row" for="volume">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4z"/><path d="M15.2 9.2a4 4 0 0 1 0 5.6"/></svg>
        <input id="volume" type="range" min="0" max="100" step="1" value="80" aria-label="Volume">
        <output id="volume-out" for="volume">80</output>
      </label>

      <h3>Ambience</h3>
      <div id="ambiences" class="segmented chars" role="radiogroup" aria-label="Ambience behind the sand">
        <button type="button" role="radio" aria-checked="true" data-ambience="none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/></svg><span>None</span></button>
        <button type="button" role="radio" aria-checked="false" data-ambience="brook"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/><path d="M1.6 18.75c.6-.86 1.1-.86 1.7 0s1.1.86 1.7 0M19 18.75c.6-.86 1.1-.86 1.7 0s1.1.86 1.7 0M1.6 16.25c.6-.86 1.1-.86 1.7 0s1.1.86 1.7 0M19 16.25c.6-.86 1.1-.86 1.7 0s1.1.86 1.7 0"/></svg><span>Brook</span></button>
        <button type="button" role="radio" aria-checked="false" data-ambience="rain"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/><path d="M4.2 6.2l-1.1 2.8M4.2 12.2l-1.1 2.8M21 9l-1.1 2.8M21 15l-1.1 2.8"/></svg><span>Rain</span></button>
        <button type="button" role="radio" aria-checked="false" data-ambience="ocean"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/><path d="M1.6 19.4c.2-2.9 1.4-4.9 3-4.9 1.2 0 1.7 1.2.9 2.1M2.3 12.6h.01M4.7 11.6h.01M22.4 19.4c-.2-2.9-1.4-4.9-3-4.9-1.2 0-1.7 1.2-.9 2.1M21.7 12.6h.01M19.3 11.6h.01"/></svg><span>Ocean</span></button>
        <button type="button" role="radio" aria-checked="false" data-ambience="waterfall"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/><path d="M3.4 4.6c-1.3 1.3-1.3 2.3 0 3.6s1.3 2.3 0 3.6-1.3 2.3 0 3.6M1.8 19.4c.5-1.1 1-1.6 1.6-1.6s1.1.5 1.6 1.6M20.6 4.6c-1.3 1.3-1.3 2.3 0 3.6s1.3 2.3 0 3.6-1.3 2.3 0 3.6M19 19.4c.5-1.1 1-1.6 1.6-1.6s1.1.5 1.6 1.6"/></svg><span>Waterfall</span></button>
        <button type="button" role="radio" aria-checked="false" data-ambience="drips"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 4.6h9.6M7.2 19.4h9.6M8.6 4.6C7.8 5.2 8.2 5.3 8.2 6.5C8.2 8.5 11.75 9 11.75 12S8.2 15.5 8.2 17.5C8.2 18.7 7.8 18.8 8.6 19.4M15.4 4.6C16.2 5.2 15.8 5.3 15.8 6.5C15.8 8.5 12.25 9 12.25 12S15.8 15.5 15.8 17.5C15.8 18.7 16.2 18.8 15.4 19.4"/><path d="M3.5 6c.875 1.16 1.25 1.875 1.25 2.5a1.25 1.25 0 0 1-2.5 0c0-.625.375-1.34 1.25-2.5zM1.8 18.6a1.6 .7 0 1 0 3.2 0a1.6 .7 0 1 0-3.2 0M20.5 9.6c.875 1.16 1.25 1.875 1.25 2.5a1.25 1.25 0 0 1-2.5 0c0-.625.375-1.34 1.25-2.5zM19 18.6a1.6 .7 0 1 0 3.2 0a1.6 .7 0 1 0-3.2 0"/></svg><span>Drips</span></button>
      </div>
      <label class="slider-row" id="amb-row" for="amb-level" hidden>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2c3 3.9 5.2 6.7 5.2 9.6a5.2 5.2 0 0 1-10.4 0c0-2.9 2.2-5.700 5.2-9.6z"/></svg>
        <input id="amb-level" type="range" min="0" max="100" step="1" value="50" aria-label="Ambience level">
        <output id="amb-out" for="amb-level">50</output>
      </label>

      <div class="rows">
        <label class="row" for="opt-chime">
          <span><b>Completion bowl</b><small>A soft singing-bowl bloom when the last grain falls</small></span>
          <input id="opt-chime" class="switch" type="checkbox" role="switch" checked>
        </label>
        <label class="row" for="opt-awake">
          <span><b>Keep screen awake</b><small id="awake-note">While the sand is flowing</small></span>
          <input id="opt-awake" class="switch" type="checkbox" role="switch" checked>
        </label>
        <label class="row" for="opt-tilt">
          <span><b>Real motion</b><small>Sand feels every lean, turn and shake.<span id="tilt-crack"> Shaking it hard can crack the glass.</span></small></span>
          <input id="opt-tilt" class="switch" type="checkbox" role="switch">
        </label>
        <label class="row" for="opt-zen">
          <span><b>Full Zen</b><small>Hide the controls completely in Zen</small></span>
          <input id="opt-zen" class="switch" type="checkbox" role="switch">
        </label>
        <label class="row" for="opt-breath">
          <span><b>Breathing pace</b><small>The glow swells as you breathe in and fades as you breathe out</small></span>
          <input id="opt-breath" class="switch" type="checkbox" role="switch">
        </label>
        <div id="breath-row" class="sub" hidden>
          <div id="breaths" class="segmented" role="radiogroup" aria-label="Breathing pattern">
            <button type="button" role="radio" aria-checked="true" data-breath="calm" aria-label="Calm: in 4 seconds, out 6">Calm <i>4·6</i></button>
            <button type="button" role="radio" aria-checked="false" data-breath="box" aria-label="Box: in 4 seconds, hold 4, out 4, hold 4">Box <i>4·4·4·4</i></button>
            <button type="button" role="radio" aria-checked="false" data-breath="deep" aria-label="Deep: in 4 seconds, hold 7, out 8">Deep <i>4·7·8</i></button>
          </div>
        </div>
        <label class="row" for="opt-haptics">
          <span><b>Haptics</b><small>Subtle taps where the device supports them</small></span>
          <input id="opt-haptics" class="switch" type="checkbox" role="switch" checked>
        </label>
      </div>

      <p class="colophon"><span id="grain-count">—</span> grains<span id="spilled"></span>, each one simulated<span id="sim-where"></span>. Every sound is synthesised live.</p>
    </div>
  </section>

  <!-- custom duration sheet -->
  <section id="sheet-custom" class="sheet" role="dialog" aria-modal="true" aria-labelledby="custom-title" hidden>
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="custom-title">Custom duration</h2>
      <button class="icon-btn sheet-close" type="button" aria-label="Close">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="dial" aria-label="Minutes and seconds">
        <div class="dial-col">
          <button class="step" type="button" data-step="min:+1" aria-label="One minute more"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 14.5L12 9l5.5 5.5"/></svg></button>
          <div class="wheel" id="wheel-min" tabindex="0" role="spinbutton" aria-label="Minutes" aria-valuemin="0" aria-valuemax="99" aria-valuenow="5"></div>
          <button class="step" type="button" data-step="min:-1" aria-label="One minute less"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5L12 15l5.5-5.5"/></svg></button>
          <span class="unit">min</span>
        </div>
        <div class="dial-sep" aria-hidden="true">:</div>
        <div class="dial-col">
          <button class="step" type="button" data-step="sec:+5" aria-label="Five seconds more"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 14.5L12 9l5.5 5.5"/></svg></button>
          <div class="wheel" id="wheel-sec" tabindex="0" role="spinbutton" aria-label="Seconds" aria-valuemin="0" aria-valuemax="59" aria-valuenow="0"></div>
          <button class="step" type="button" data-step="sec:-5" aria-label="Five seconds less"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5L12 15l5.5-5.5"/></svg></button>
          <span class="unit">sec</span>
        </div>
        <div class="dial-band" aria-hidden="true"></div>
      </div>
      <!-- work and rest: a rest after the glass, and the pair repeated -->
      <div id="seq" class="rows">
        <div class="row">
          <span><b id="rest-name">Then rest</b></span>
          <div class="stepper" role="group" aria-labelledby="rest-name">
            <button type="button" data-seq="rest:-1" aria-label="One minute less rest" aria-disabled="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"/></svg></button>
            <output id="rest-out" class="off" aria-live="polite">Off</output>
            <button type="button" data-seq="rest:1" aria-label="One minute more rest"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v10M7 12h10"/></svg></button>
          </div>
        </div>
        <div class="row" id="seq-hint"><small>Add a rest and the glass turns itself over</small></div>
        <div class="row" id="rounds-row" hidden>
          <span><b id="rounds-name">Rounds</b></span>
          <div class="stepper" role="group" aria-labelledby="rounds-name">
            <button type="button" data-seq="rounds:-1" aria-label="One round fewer" aria-disabled="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"/></svg></button>
            <output id="rounds-out" aria-live="polite">1</output>
            <button type="button" data-seq="rounds:1" aria-label="One round more"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v10M7 12h10"/></svg></button>
          </div>
        </div>
      </div>
      <button id="custom-set" class="cta" type="button">Set <span id="custom-preview">05:00</span></button>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="veil" class="boot" aria-hidden="true"></div>
  <div id="safe" aria-hidden="true"></div>
</div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#d8d2c8;font:16px system-ui">Hourglass needs JavaScript to simulate its sand.</p></noscript>

<script src="./physics.js" defer></script>
<script src="./audio.js" defer></script>
<script src="./motion.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
